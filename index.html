<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An anonymized Lean Six Sigma project portfolio covering 17 improvement engagements and €6.69m in realized and client-validated impact.">
  <title>Lean Six Sigma Project Portfolio — Thomas Spijker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d6a84b'/%3E%3Ctext x='32' y='43' font-family='Arial' font-size='26' font-weight='800' text-anchor='middle' fill='%23102a43'%3ETS%3C/text%3E%3C/svg%3E">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Thomas Spijker — Lean Six Sigma Project Portfolio">
  <meta property="og:description" content="17 improvement engagements, €51.7m analyzed spend, €6.69m realized and client-validated impact.">
  <meta property="og:url" content="https://tspijker95.github.io/portfolio/">
  <meta name="twitter:card" content="summary">
  <style>
    :root {
      --ink:#102a43;
      --ink-2:#243b53;
      --muted:#627d98;
      --paper:#fff;
      --canvas:#f4f7f9;
      --canvas-2:#edf3f5;
      --teal:#147d7e;
      --teal-dark:#0d5f61;
      --teal-soft:#dceeee;
      --gold:#d6a84b;
      --gold-soft:#f6ecd3;
      --shadow:0 1px 2px rgba(16,42,67,.05);
      --radius:10px;
      --max:1180px;
      --serif:Charter,"Iowan Old Style",Georgia,"Times New Roman",serif;
      --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;color:var(--ink-2);background:var(--canvas);font-family:var(--sans);line-height:1.55;text-rendering:optimizeLegibility}
    a{color:inherit}
    button,input,select{font:inherit}
    button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid rgba(20,125,126,.35);outline-offset:3px}
    .shell{width:min(var(--max),calc(100% - 40px));margin:0 auto}
    .section{padding:82px 0}
    .section.alt{background:var(--canvas-2)}
    .section-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,430px);gap:42px;align-items:end;margin-bottom:36px}
    .section-head h2,.hero h1,.case-title{font-family:var(--serif)}
    .section-head h2{margin:0;color:var(--ink);font-size:clamp(2rem,4vw,3.25rem);line-height:1.02;letter-spacing:-.035em}
    .section-head p{margin:0;color:var(--muted);font-size:1.02rem}
    .skip-link{position:absolute;left:12px;top:-70px;z-index:100;padding:10px 14px;color:white;background:var(--ink);border-radius:8px}
    .skip-link:focus{top:12px}

    .site-nav{position:sticky;top:0;z-index:50;color:white;background:rgba(16,42,67,.97);backdrop-filter:blur(12px)}
    .nav-inner{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:18px}
    .brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800}
    .brand-mark{width:34px;height:34px;display:grid;place-items:center;color:var(--ink);background:var(--gold);border-radius:9px;font-size:.78rem;font-weight:900}
    .nav-links{display:flex;align-items:center;gap:20px}
    .nav-links>a{color:rgba(255,255,255,.75);text-decoration:none;font-size:.88rem;font-weight:700}
    .nav-links>a:hover,.nav-links>a.active{color:#fff}
    .nav-actions{display:flex;align-items:center;gap:10px}
    .language-switch{display:flex;background:rgba(255,255,255,.08);border-radius:9px;padding:3px}
    .language-option{min-width:38px;min-height:34px;border:0;border-radius:7px;color:rgba(255,255,255,.72);background:transparent;cursor:pointer;font-weight:800}
    .language-option.active{color:var(--ink);background:white}
    .print-btn{min-height:40px;padding:0 14px;color:white;background:transparent;border:1px solid rgba(255,255,255,.28);border-radius:9px;cursor:pointer}

    .hero{color:white;background:radial-gradient(circle at 83% 16%,rgba(214,168,75,.24),transparent 27%),linear-gradient(135deg,#102a43 0%,#102a43 60%,#153e59 100%);padding:92px 0 78px}
    .hero-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(315px,.65fr);gap:62px;align-items:end}
    .hero h1{max-width:760px;margin:0;font-size:clamp(3rem,6vw,4.5rem);line-height:.96;letter-spacing:-.05em}
    .hero-byline{margin:20px 0 0;color:#f1cf84;font-size:.92rem;font-weight:700}
    .hero .lead{max-width:740px;margin:20px 0 0;color:rgba(255,255,255,.76);font-size:clamp(1.05rem,2vw,1.28rem)}
    .hero-meta{display:flex;flex-wrap:wrap;gap:9px;margin-top:28px}
    .hero-meta span{padding:7px 11px;color:rgba(255,255,255,.9);background:rgba(255,255,255,.08);border-radius:999px;font-size:.83rem;font-weight:700}
    .hero-side{padding:26px;background:rgba(255,255,255,.08);border-radius:var(--radius)}
    .hero-side h2{margin:0 0 19px;font:700 .88rem/1.2 var(--sans);color:rgba(255,255,255,.9)}
    .hero-side dl{display:grid;grid-template-columns:1fr auto;gap:13px 18px;margin:0}
    .hero-side dt{color:rgba(255,255,255,.65)}
    .hero-side dd{margin:0;max-width:220px;color:white;font-weight:700;text-align:right}

    .kpi-section{position:relative;z-index:3;margin-top:-30px}
    .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:white;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
    .kpi{padding:24px 25px 26px}
    .kpi span{display:block;color:var(--muted);font-size:.82rem;font-weight:700}
    .kpi strong{display:block;margin-top:7px;color:var(--ink);font-size:clamp(1.85rem,3vw,2.55rem);line-height:1;font-family:var(--sans);letter-spacing:-.035em}
    .kpi small{display:block;margin-top:8px;color:var(--muted)}

    .impact-card{background:white;border-radius:var(--radius);box-shadow:var(--shadow);padding:34px}
    .impact-realized{display:flex;justify-content:space-between;gap:24px;align-items:flex-end}
    .impact-realized h3{margin:0;color:var(--ink);font-size:clamp(1.55rem,3vw,2.35rem);line-height:1.08;letter-spacing:-.035em}
    .impact-realized p{margin:0;color:var(--muted);max-width:520px;text-align:right}
    .proportion-bar{display:flex;gap:2px;height:12px;margin-top:26px;background:white;border-radius:3px;overflow:hidden}
    .segment{min-width:2px}
    .seg-realized{background:var(--teal-dark)}
    .seg-oneoff{background:var(--gold)}
    .seg-potential{background:#97a9b8}
    .proportion-labels{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:14px}
    .proportion-labels strong{display:block;color:var(--ink);font-size:1rem}
    .proportion-labels span{display:block;color:var(--muted);font-size:.82rem;margin-top:3px}
    .client-impact{margin-top:42px}
    .client-impact-head{display:flex;justify-content:space-between;gap:24px;align-items:baseline;margin-bottom:18px}
    .client-impact-head h3{margin:0;color:var(--ink);font-size:1.25rem}
    .client-impact-head p{margin:0;color:var(--muted);font-size:.86rem}
    .impact-list{display:grid;gap:15px}
    .impact-row-head{display:flex;justify-content:space-between;gap:18px;margin-bottom:6px;font-size:.91rem}
    .impact-row-head span{color:var(--ink-2)}
    .impact-row-head strong{color:var(--ink)}
    .impact-track{height:8px;background:#e5edf1;border-radius:999px;overflow:hidden}
    .impact-fill{height:100%;background:var(--teal);border-radius:999px}
    .facts-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:30px;margin-top:38px}
    .fact{min-width:0}
    .fact strong{display:block;color:var(--ink);font-size:clamp(1.55rem,2.6vw,2.2rem);line-height:1.05;letter-spacing:-.035em}
    .fact span{display:block;margin-top:7px;color:var(--muted);font-size:.88rem}

    .feature-list{display:grid;gap:24px}
    .case-feature{padding:36px;background:white;border-radius:var(--radius);box-shadow:var(--shadow)}
    .case-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:30px;align-items:start}
    .case-theme{margin:0 0 8px;color:var(--teal);font-size:.83rem;font-weight:700}
    .case-title{margin:0;color:var(--ink);font-size:clamp(1.65rem,3vw,2.3rem);line-height:1.05;letter-spacing:-.025em}
    .case-meta{margin:7px 0 0;color:var(--muted);font-size:.9rem}
    .case-impact{text-align:right}
    .case-impact strong{display:block;color:var(--ink);font-size:1.55rem;letter-spacing:-.035em}
    .case-impact span{display:block;margin-top:4px;max-width:220px;color:var(--muted);font-size:.78rem}
    .case-columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:28px;align-items:stretch}
    .case-col{padding:0}
    .case-col.result{padding:20px;background:var(--teal-soft);border-radius:8px}
    .case-col h4{margin:0 0 8px;color:var(--ink);font-size:.88rem}
    .case-col p{margin:0;color:var(--ink-2);font-size:.93rem}

    .methods-list{max-width:780px;display:grid;gap:5px}
    .method-row{display:grid;grid-template-columns:minmax(0,1fr) 210px 38px;gap:18px;align-items:center;min-height:48px}
    .method-copy{min-width:0}
    .method-copy strong{display:block;color:var(--ink);font-size:.94rem}
    .method-copy span{display:block;color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .method-track{height:8px;background:#dfe8ec;border-radius:999px;overflow:hidden}
    .method-fill{height:100%;background:var(--teal);border-radius:999px}
    .method-count{color:var(--ink);font-weight:800;text-align:right}

    .library-controls{display:grid;grid-template-columns:1.4fr .8fr .9fr .9fr;gap:12px;margin-bottom:14px}
    .control{width:100%;min-height:44px;padding:0 12px;color:var(--ink-2);background:white;border:1px solid #c7d3dc;border-radius:8px}
    .results-meta{margin:0 0 18px;color:var(--muted);font-size:.88rem}
    .project-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .project-card{background:white;border-radius:var(--radius);box-shadow:var(--shadow);padding:25px}
    .project-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:start}
    .project-card h3{margin:0;color:var(--ink);font-size:1.18rem;line-height:1.2}
    .project-client{margin:5px 0 0;color:var(--muted);font-size:.83rem}
    .project-impact{color:var(--ink);font-size:1.18rem;font-weight:800;text-align:right}
    .project-line{margin:15px 0 0;color:var(--muted);font-size:.82rem}
    .project-data{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}
    .project-data span{display:block;color:var(--muted);font-size:.75rem;font-weight:700}
    .project-data strong{display:block;margin-top:4px;color:var(--ink);font-size:.9rem}
    details{margin-top:18px;background:#f6f9fa;border-radius:8px;padding:0 15px}
    summary{padding:13px 0;cursor:pointer;color:var(--teal-dark);font-weight:700;font-size:.88rem}
    .detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding:2px 0 16px}
    .detail-block h4{margin:0 0 6px;color:var(--ink);font-size:.82rem}
    .detail-block p{margin:0;color:var(--ink-2);font-size:.86rem}
    .show-all-wrap{display:flex;justify-content:center;margin-top:24px}
    .show-all{min-height:46px;padding:0 20px;border:0;border-radius:8px;color:white;background:var(--ink);font-weight:800;cursor:pointer}
    [hidden]{display:none!important}

    footer{padding:42px 0;color:rgba(255,255,255,.76);background:var(--ink)}
    .footer-grid{display:flex;justify-content:space-between;gap:36px;align-items:flex-start}
    footer strong{color:#fff}
    footer p{max-width:700px;margin:6px 0 0}
    footer a{color:inherit;text-decoration:underline;text-underline-offset:2px}
    .footer-person{display:grid;gap:2px;text-align:right}

    @media (max-width:900px){
      .nav-links>a{display:none}
      .hero-grid,.section-head{grid-template-columns:1fr}
      .hero-grid{gap:38px}
      .hero-side{max-width:620px}
      .kpi-grid,.facts-grid{grid-template-columns:repeat(2,1fr)}
      .case-columns{grid-template-columns:1fr}
      .case-col.result{padding:18px}
      .library-controls{grid-template-columns:1fr 1fr}
      .method-row{grid-template-columns:minmax(0,1fr) 150px 34px}
    }
    @media (max-width:640px){
      .shell{width:min(var(--max),calc(100% - 28px))}
      .section{padding:64px 0}
      .nav-inner{min-height:60px}
      .brand span:last-child{display:none}
      .print-btn{display:none}
      .hero{padding:68px 0 58px}
      .hero h1{font-size:clamp(2.7rem,13vw,3.65rem)}
      .hero-side dl{grid-template-columns:1fr}
      .hero-side dd{text-align:left;max-width:none;margin-top:-7px}
      .kpi-section{margin-top:0;padding-top:14px}
      .kpi-grid,.facts-grid,.project-grid{grid-template-columns:1fr}
      .impact-card,.case-feature,.project-card{padding:22px}
      .impact-realized,.client-impact-head,.case-head,.footer-grid{display:block}
      .impact-realized p,.client-impact-head p{text-align:left;margin-top:9px}
      .proportion-labels{grid-template-columns:1fr;gap:10px}
      .case-impact{text-align:left;margin-top:14px}
      .method-row{grid-template-columns:minmax(0,1fr) 70px 30px;gap:10px}
      .method-copy span{display:none}
      .library-controls{grid-template-columns:1fr}
      .project-data,.detail-grid{grid-template-columns:1fr}
      .footer-person{text-align:left;margin-top:20px}
    }
    @media (prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
    }
    @media print{
      @page{size:A4;margin:12mm}
      html,body{background:#fff}
      .site-nav,.show-all-wrap,.library-controls,.results-meta{display:none!important}
      .hero{padding:24px 0;background:#102a43!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .hero-grid{grid-template-columns:1.3fr .7fr;gap:26px}
      .hero h1{font-size:34pt}
      .hero-side{padding:18px}
      .kpi-section{margin-top:0;padding-top:10px}
      .section{padding:28px 0}
      .section.alt{background:#f4f7f9!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .section-head{margin-bottom:18px}
      .section-head h2{font-size:23pt}
      .impact-card,.case-feature,.project-card{box-shadow:none}
      .feature-list,.project-grid{gap:12px}
      .case-feature,.project-card,.method-row,.impact-row{break-inside:avoid}
      .case-feature{padding:20px}
      .project-grid{grid-template-columns:1fr 1fr}
      details{background:#f6f9fa!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .case-col.result{background:#dceeee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      footer{background:#102a43!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main" id="skipLink">Skip to content</a>

  <nav class="site-nav" aria-label="Portfolio navigation">
    <div class="shell nav-inner">
      <a class="brand" href="#top"><span class="brand-mark">TS</span><span id="brandText">Project Portfolio</span></a>
      <div class="nav-links">
        <a href="#impact" id="navImpact">Impact</a>
        <a href="#cases" id="navCases">Selected cases</a>
        <a href="#methods" id="navMethods">Methods</a>
        <a href="#library" id="navLibrary">Full library</a>
        <div class="nav-actions">
          <div class="language-switch" role="group" aria-label="Language / Taal">
            <button class="language-option active" type="button" id="langEn" data-lang="en" aria-pressed="true">EN</button>
            <button class="language-option" type="button" id="langNl" data-lang="nl" aria-pressed="false">NL</button>
          </div>
          <button class="print-btn" type="button" id="printButton">Print / Save PDF</button>
        </div>
      </div>
    </div>
  </nav>

  <header class="hero" id="top">
    <div class="shell hero-grid">
      <div>
        <h1 id="heroTitle">From analysis to implemented impact.</h1>
        <p class="hero-byline" id="heroByline"></p>
        <p class="lead" id="heroLead"></p>
        <div class="hero-meta">
          <span id="metaYears"></span>
          <span id="metaImpl"></span>
          <span id="metaTeam"></span>
        </div>
      </div>
      <aside class="hero-side" aria-labelledby="deliveryTitle">
        <h2 id="deliveryTitle"></h2>
        <dl>
          <dt id="deliveryTypical"></dt><dd id="deliveryMonths"></dd>
          <dt id="deliveryWorkstreams"></dt><dd>4–5</dd>
          <dt id="deliveryTeam"></dt><dd id="deliveryConsultants"></dd>
          <dt id="deliveryGovernance"></dt><dd id="deliveryGovValue"></dd>
          <dt id="deliveryCommercial"></dt><dd id="deliveryCommercialValue"></dd>
          <dt id="deliveryValidation"></dt><dd id="deliveryValidated"></dd>
        </dl>
      </aside>
    </div>
  </header>

  <main id="main">
    <section class="kpi-section" aria-label="Portfolio metrics">
      <div class="shell">
        <div class="kpi-grid">
          <div class="kpi"><span id="kpiProjects"></span><strong id="kpiProjectsValue"></strong><small id="kpiProjectsSub"></small></div>
          <div class="kpi"><span id="kpiSpend"></span><strong id="kpiSpendValue"></strong><small id="kpiSpendSub"></small></div>
          <div class="kpi"><span id="kpiImpact"></span><strong id="kpiImpactValue"></strong><small id="kpiImpactSub"></small></div>
          <div class="kpi"><span id="kpiRate"></span><strong id="kpiRateValue"></strong><small id="kpiRateSub"></small></div>
        </div>
      </div>
    </section>

    <section class="section" id="impact">
      <div class="shell">
        <div class="section-head">
          <h2 id="impactTitle"></h2>
          <p id="impactIntro"></p>
        </div>
        <article class="impact-card">
          <div class="impact-realized">
            <h3 id="realizedHeadline"></h3>
            <p id="realizedNote"></p>
          </div>
          <div class="proportion-bar" role="img" id="proportionBar">
            <span class="segment seg-realized" id="segRealized"></span>
            <span class="segment seg-oneoff" id="segOneoff"></span>
            <span class="segment seg-potential" id="segPotential"></span>
          </div>
          <div class="proportion-labels">
            <div><strong id="realizedRecurringValue"></strong><span id="realizedRecurringLabel"></span></div>
            <div><strong id="oneOffValue"></strong><span id="oneOffLabel"></span></div>
            <div><strong id="potentialValue"></strong><span id="potentialLabel"></span></div>
          </div>

          <div class="client-impact">
            <div class="client-impact-head"><h3 id="impactClientTitle"></h3><p id="anonNote"></p></div>
            <div class="impact-list" id="impactList"></div>
          </div>
        </article>

        <div class="facts-grid">
          <div class="fact"><strong id="factValidatedValue"></strong><span id="factValidated"></span></div>
          <div class="fact"><strong id="factLargestValue"></strong><span id="factLargest"></span></div>
          <div class="fact"><strong>70% → 88%</strong><span id="factFill"></span></div>
          <div class="fact"><strong>44.5% → 78%</strong><span id="factFtr"></span></div>
        </div>
      </div>
    </section>

    <section class="section alt" id="cases">
      <div class="shell">
        <div class="section-head"><h2 id="casesTitle"></h2><p id="casesIntro"></p></div>
        <div class="feature-list" id="featureList"></div>
      </div>
    </section>

    <section class="section" id="methods">
      <div class="shell">
        <div class="section-head"><h2 id="methodsTitle"></h2><p id="methodsIntro"></p></div>
        <div class="methods-list" id="methodsList"></div>
      </div>
    </section>

    <section class="section alt" id="library">
      <div class="shell">
        <div class="section-head"><h2 id="libraryTitle"></h2><p id="libraryIntro"></p></div>
        <div class="library-controls" id="libraryControls" hidden>
          <input class="control" id="searchInput" type="search" aria-label="Search projects">
          <select class="control" id="clientFilter" aria-label="Filter by client"></select>
          <select class="control" id="categoryFilter" aria-label="Filter by intervention"></select>
          <select class="control" id="sortSelect" aria-label="Sort projects"></select>
        </div>
        <p class="results-meta" id="resultsMeta" aria-live="polite" hidden></p>
        <div class="project-grid" id="projectGrid"></div>
        <div class="show-all-wrap" id="showAllWrap">
          <button class="show-all" type="button" id="showAllButton" aria-expanded="false" aria-controls="projectGrid"></button>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="shell footer-grid">
      <div><strong id="footerTitle"></strong><p id="footerText"></p></div>
      <div class="footer-person"><strong>Thomas Spijker</strong><span>Senior Management Consultant</span><span id="location"></span><a href="mailto:t.spijker@hotmail.com">t.spijker@hotmail.com</a></div>
    </div>
  </footer>

  <script>
    (() => {
      'use strict';

        text('navLibrary', c.navLibrary);
        text('printButton', c.print);
        text('heroTitle', c.heroTitle);
        text('heroByline', c.byline);
        text('heroLead', template(c.heroLead, {
          projects: projectCount,
          spend: compactMoney(totalSpend),
          impact: compactMoney(totalImpact)
        }));
        text('metaYears', c.metaYears);
        text('metaImpl', c.metaImpl);
        text('metaTeam', c.metaTeam);
        ['deliveryTitle','deliveryTypical','deliveryMonths','deliveryWorkstreams','deliveryTeam','deliveryConsultants',
         'deliveryGovernance','deliveryGovValue','deliveryCommercial','deliveryCommercialValue','deliveryValidation','deliveryValidated',
         'kpiProjects','kpiProjectsSub','kpiSpend','kpiSpendSub','kpiImpact','kpiImpactSub','kpiRate','kpiRateSub',
         'impactIntro','impactClientTitle','anonNote','factValidated','factLargest','factFill','factFtr',
         'casesTitle','casesIntro','methodsTitle','libraryTitle','libraryIntro','footerTitle','footerText','location'
        ].forEach(key => text(key, c[key]));

        text('kpiProjectsValue', projectCount);
        text('kpiSpendValue', compactMoney(totalSpend));
        text('kpiImpactValue', compactMoney(totalImpact));
        text('kpiRateValue', pct(impactRate,1));

        const impactTitle = lang === 'nl'
          ? `${compactMoney(totalImpact)} financiële impact bij ${clientCount} geanonimiseerde klanten.`
          : `${compactMoney(totalImpact)} across ${clientCount} anonymized clients.`;
        text('impactTitle', impactTitle);
        const realizedHeadline = lang === 'nl'
          ? `${pct(realizedPct,1)} van de ${compactMoney(totalImpact)} is gerealiseerd.`
          : `${pct(realizedPct,1)} of the ${compactMoney(totalImpact)} is realized.`;
        text('realizedHeadline', realizedHeadline);
        text('realizedNote', lang === 'nl'
          ? 'Het resterende deel betreft besparingspotentieel dat samen met de klant is gevalideerd en nog in implementatie is.'
          : 'The remainder is client-validated savings potential in projects that are still in implementation.');

        text('realizedRecurringValue', `${money(realizedRecurring)} (${pct(realizedRecurring/totalImpact,1)})`);
        text('realizedRecurringLabel', c.realizedRecurring);
        text('oneOffValue', `${money(oneOff)} (${pct(oneOff/totalImpact,1)})`);
        text('oneOffLabel', c.oneOff);
        text('potentialValue', `${money(potential)} (${pct(potential/totalImpact,1)})`);
        text('potentialLabel', `${c.potential} · ${potentialCount} ${c.potentialSuffix}`);

        $('segRealized').style.width = `${(realizedRecurring/totalImpact*100).toFixed(3)}%`;
        $('segOneoff').style.width = `${(oneOff/totalImpact*100).toFixed(3)}%`;
        $('segPotential').style.width = `${(potential/totalImpact*100).toFixed(3)}%`;
        $('proportionBar').setAttribute('aria-label',
          lang === 'nl'
          ? `${c.realizedRecurring} ${money(realizedRecurring)}, ${c.oneOff} ${money(oneOff)}, ${c.potential} ${money(potential)}`
          : `${c.realizedRecurring} ${money(realizedRecurring)}, ${c.oneOff} ${money(oneOff)}, ${c.potential} ${money(potential)}`
        );

        text('factValidatedValue', `${validatedCount} / ${projectCount}`);
        text('factLargestValue', compactMoney(largestImpact));
        text('methodsIntro', template(c.methodsIntro, {projects:projectCount}));
        text('showAllButton', template(c.showAll, {projects:projectCount}));
        $('showAllButton').setAttribute('aria-expanded', String(libraryExpanded));
        $('searchInput').placeholder = c.searchPlaceholder;
        $('searchInput').setAttribute('aria-label', c.searchPlaceholder);

        $('langEn').classList.toggle('active', lang==='en');
        $('langNl').classList.toggle('active', lang==='nl');
        $('langEn').setAttribute('aria-pressed', String(lang==='en'));
        $('langNl').setAttribute('aria-pressed', String(lang==='nl'));

        const desc = `${projectCount} improvement engagements, ${compactMoney(totalSpend)} analyzed spend, ${compactMoney(totalImpact)} realized and client-validated impact.`;
        const metaDesc = document.querySelector('meta[name="description"]');
        const ogDesc = document.querySelector('meta[property="og:description"]');
        if (metaDesc) metaDesc.setAttribute('content', desc);
        if (ogDesc) ogDesc.setAttribute('content', desc);
      }

      function renderImpactClients() {
        const totals = new Map();
        DATA.projects.forEach(p => {
          if (!totals.has(p.clientCode)) totals.set(p.clientCode, {impact:0, sector:p.sector});
          totals.get(p.clientCode).impact += p.impact;
        });
        const rows = [...totals.entries()].map(([code,v])=>({code,...v})).sort((a,b)=>b.impact-a.impact);
        const max = Math.max(...rows.map(r=>r.impact),1);
        $('impactList').innerHTML = rows.map(r => `
          <div class="impact-row">
            <div class="impact-row-head">
              <span>${escapeHTML(clientLabel(r.code))} · ${escapeHTML(local(r.sector))}</span>
              <strong>${escapeHTML(compactMoney(r.impact))}</strong>
            </div>
            <div class="impact-track" aria-hidden="true"><div class="impact-fill" style="width:${(r.impact/max*100).toFixed(1)}%"></div></div>
          </div>`).join('');
      }

      function renderSelectedCases() {
        const themes = {p09:C[lang].themeP09,p16:C[lang].themeP16,p05:C[lang].themeP05};
        $('featureList').innerHTML = FEATURED.map(id => {
          const p = DATA.projects.find(x=>x.id===id);
          return `
            <article class="case-feature">
              <div class="case-head">
                <div>
                  <p class="case-theme">${escapeHTML(themes[id])}</p>
                  <h3 class="case-title">${escapeHTML(local(p.project))}</h3>
                  <p class="case-meta">${escapeHTML(clientLabel(p.clientCode))} · ${escapeHTML(local(p.sector))}</p>
                </div>
                <div class="case-impact">
                  <strong>${escapeHTML(compactMoney(p.impact))}</strong>
                  <span>${escapeHTML(local(p.impactType))}</span>
                </div>
              </div>
              <div class="case-columns">
                <div class="case-col"><h4>${escapeHTML(C[lang].challenge)}</h4><p>${escapeHTML(local(p.challenge))}</p></div>
                <div class="case-col"><h4>${escapeHTML(C[lang].intervention)}</h4><p>${escapeHTML(local(p.approach))}</p></div>
                <div class="case-col result"><h4>${escapeHTML(C[lang].result)}</h4><p>${escapeHTML(local(p.result))}</p></div>
              </div>
            </article>`;
        }).join('');
      }

      function renderMethods() {
        const sorted = [...DATA.competencies].sort((a,b)=>b.count-a.count || String(local(a.name)).localeCompare(String(local(b.name)), locale()));
        $('methodsList').innerHTML = sorted.map(m => `
          <div class="method-row">
            <div class="method-copy"><strong>${escapeHTML(local(m.name))}</strong><span title="${escapeHTML(local(m.evidence))}">${escapeHTML(local(m.evidence))}</span></div>
            <div class="method-track" aria-hidden="true"><div class="method-fill" style="width:${Math.min(100,m.count/projectCount*100).toFixed(1)}%"></div></div>
            <div class="method-count">${escapeHTML(m.count)}</div>
          </div>`).join('');
      }

      function populateControls() {
        const c=C[lang];
        const clients=[...new Set(DATA.projects.map(p=>p.clientCode))].sort();
        const categories=[...new Set(DATA.projects.flatMap(p=>local(p.categories) || []))].sort((a,b)=>a.localeCompare(b,locale()));
        $('clientFilter').innerHTML = `<option value="">${escapeHTML(c.allClients)}</option>` + clients.map(code=>`<option value="${escapeHTML(code)}">${escapeHTML(clientLabel(code))}</option>`).join('');
        $('categoryFilter').innerHTML = `<option value="">${escapeHTML(c.allInterventions)}</option>` + categories.map(cat=>`<option value="${escapeHTML(cat)}">${escapeHTML(cat)}</option>`).join('');
        $('sortSelect').innerHTML = `
          <option value="impact-desc">${escapeHTML(c.sortImpactDesc)}</option>
          <option value="impact-asc">${escapeHTML(c.sortImpactAsc)}</option>
          <option value="saving-desc">${escapeHTML(c.sortSavingDesc)}</option>
          <option value="project-asc">${escapeHTML(c.sortProjectAsc)}</option>`;
      }

      function projectCard(p) {
        const c=C[lang];
        const cats=(local(p.categories)||[]).map(escapeHTML);
        const line=[...cats, escapeHTML(local(p.impactType))].join(' · ');
        const spend = p.spend == null ? '—' : money(p.spend);
        const saving = p.saving == null ? '—' : pct(p.saving,1);
        return `
          <article class="project-card">
            <div class="project-top">
              <div><h3>${escapeHTML(local(p.project))}</h3><p class="project-client">${escapeHTML(clientLabel(p.clientCode))} · ${escapeHTML(local(p.sector))}</p></div>
              <div class="project-impact">${escapeHTML(compactMoney(p.impact))}</div>
            </div>
            <p class="project-line">${line}</p>
            <div class="project-data">
              <div><span>${escapeHTML(c.spendBaseline)}</span><strong>${escapeHTML(spend)}</strong></div>
              <div><span>${escapeHTML(c.savings)}</span><strong>${escapeHTML(saving)}</strong></div>
              <div><span>${escapeHTML(c.projectType)}</span><strong>${escapeHTML(local(p.type))}</strong></div>
            </div>
            <details>
              <summary>${escapeHTML(c.openDetails)}</summary>
              <div class="detail-grid">
                <div class="detail-block"><h4>${escapeHTML(c.challenge)}</h4><p>${escapeHTML(local(p.challenge))}</p></div>
                <div class="detail-block"><h4>${escapeHTML(c.approachTools)}</h4><p>${escapeHTML(local(p.approach))}</p></div>
                <div class="detail-block"><h4>${escapeHTML(c.roleLeadership)}</h4><p>${escapeHTML(local(p.role))}</p></div>
                <div class="detail-block"><h4>${escapeHTML(c.implementedSolution)}</h4><p>${escapeHTML(local(p.solution))}</p></div>
                <div class="detail-block"><h4>${escapeHTML(c.statusValidation)}</h4><p>${escapeHTML(local(p.status))}</p></div>
              </div>
            </details>
          </article>`;
      }

      function filteredProjects(ignoreFilters=false) {
        let projects=[...DATA.projects];
        if (!ignoreFilters) {
          const q=$('searchInput').value.trim().toLocaleLowerCase(locale());
          const client=$('clientFilter').value;
          const category=$('categoryFilter').value;
          if (q) {
            projects=projects.filter(p => [
              local(p.project),local(p.sector),local(p.type),local(p.result),local(p.challenge),local(p.approach),local(p.role),local(p.solution),local(p.status),
              ...(local(p.categories)||[])
            ].join(' ').toLocaleLowerCase(locale()).includes(q));
          }
          if (client) projects=projects.filter(p=>p.clientCode===client);
          if (category) projects=projects.filter(p=>(local(p.categories)||[]).includes(category));
        }
        const sort=ignoreFilters ? 'impact-desc' : $('sortSelect').value;
        projects.sort((a,b)=>{
          if(sort==='impact-asc') return a.impact-b.impact;
          if(sort==='saving-desc') return (b.saving ?? -1)-(a.saving ?? -1);
          if(sort==='project-asc') return String(local(a.project)).localeCompare(String(local(b.project)),locale());
          return b.impact-a.impact;
        });
        return projects;
      }

      function renderProjects(ignoreFilters=false) {
        let projects;
        if (!libraryExpanded && !ignoreFilters) {
          projects = teaserIds.map(id=>DATA.projects.find(p=>p.id===id));
        } else {
          projects = filteredProjects(ignoreFilters);
        }
        $('projectGrid').innerHTML = projects.map(projectCard).join('') || `<p>${escapeHTML(C[lang].noResults)}</p>`;
        if (libraryExpanded) {
          $('resultsMeta').textContent = `${projects.length} ${C[lang].projectsOf} ${projectCount} ${C[lang].projectsLabel}`;
        }
      }

      function expandLibrary(fromPrint=false) {
        if (!libraryExpanded) {
          libraryExpanded=true;
          $('libraryControls').hidden=false;
          $('resultsMeta').hidden=false;
          $('showAllWrap').hidden=true;
          $('showAllButton').setAttribute('aria-expanded','true');
        }
        renderProjects(fromPrint);
      }

      function renderAll() {
        renderStaticCopy();
        renderImpactClients();
        renderSelectedCases();
        renderMethods();
        populateControls();
        $('libraryControls').hidden=!libraryExpanded;
        $('resultsMeta').hidden=!libraryExpanded;
        $('showAllWrap').hidden=libraryExpanded;
        renderProjects();
      }

      $('showAllButton').addEventListener('click',()=>expandLibrary(false));
      ['searchInput','clientFilter','categoryFilter','sortSelect'].forEach(id => {
        $(id).addEventListener(id==='searchInput' ? 'input' : 'change',()=>renderProjects(false));
      });
      $('langEn').addEventListener('click',()=>{ if(lang==='en')return; lang='en'; renderAll(); });
      $('langNl').addEventListener('click',()=>{ if(lang==='nl')return; lang='nl'; renderAll(); });
      $('printButton').addEventListener('click',()=>window.print());

      let printWasExpanded = false;
      window.addEventListener('beforeprint', () => {
        printWasExpanded = libraryExpanded;
        if (libraryExpanded) {
          printFilterState = {
            search:$('searchInput').value,
            client:$('clientFilter').value,
            category:$('categoryFilter').value,
            sort:$('sortSelect').value
          };
        } else {
          printFilterState = null;
        }
        expandLibrary(true);
        renderProjects(true);
        openedForPrint = [...document.querySelectorAll('details:not([open])')];
        openedForPrint.forEach(d => d.open = true);
      });

      window.addEventListener('afterprint', () => {
        openedForPrint.forEach(d => d.open = false);
        openedForPrint = [];
        if (printFilterState) {
          $('searchInput').value=printFilterState.search;
          $('clientFilter').value=printFilterState.client;
          $('categoryFilter').value=printFilterState.category;
          $('sortSelect').value=printFilterState.sort;
          renderProjects(false);
        } else {
          renderProjects(false);
        }
        printFilterState = null;
      });

      const navLinks=[...document.querySelectorAll('.nav-links>a')];
      const sections=['impact','cases','methods','library'].map(id=>$(id));
      if ('IntersectionObserver' in window) {
        const observer=new IntersectionObserver(entries=>{
          const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];
          if(!visible)return;
          navLinks.forEach(link=>link.classList.toggle('active',link.getAttribute('href')===`#${visible.target.id}`));
        },{rootMargin:'-20% 0px -70% 0px',threshold:[0,.2,.5]});
        sections.forEach(section=>observer.observe(section));
      }

      renderAll();
    })();
  </script>
</body>
</html>
